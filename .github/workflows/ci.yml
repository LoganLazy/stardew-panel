name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: server/go.sum
      - run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      # 固定版本：v1.8.0 要求 go 1.26，与本项目 go 1.25 工具链不兼容
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file docker/.env.example -f docker/docker-compose.yml config --quiet
      - run: docker build -f docker/Dockerfile.panel -t stardew-panel:ci .
